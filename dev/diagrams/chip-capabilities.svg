<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1104" viewBox="0 0 1200 1104" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the BMP581 does</title>
<desc id="chip-capabilities-desc">Capability map of the BMP581: Pressure and temperature (supported): Reads both compensated results in one burst, 1/64 Pa and 1/65536 °C per count; Power modes (supported): One forced measurement on request, normal mode at a set rate, continuous, standby or deep standby; Oversampling and data rate (supported): Trades noise for current and speed, x1 to x128, with the rate checked against the chosen oversampling; IIR filter (supported): Low-pass filters pressure and temperature, for the data registers, the FIFO or the out-of-range check; FIFO (supported): Buffers up to 32 frames, streaming or stop-on-full, with a threshold and decimation; Interrupts (supported): Data ready, FIFO full and FIFO threshold on the INT pin, push-pull or open drain; Out-of-range detection (supported): Flags pressure that leaves a window around a reference for 1, 3, 7 or 15 samples in a row; Reset and identity (supported): Soft reset, chip ID and NVM checks at start, and a power-on reset found mid-session; NVM, I3C and 3-wire SPI (not covered): Six user NVM bytes, the I3C bus and 3-wire SPI; the driver never programs the NVM.</desc>
