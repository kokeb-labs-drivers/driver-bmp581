<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="649" viewBox="0 0 1024 649" role="img" aria-labelledby="chip-circuit-spi4-title chip-circuit-spi4-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-spi4-title">BMP581: SPI 4-wire connection</title>
<desc id="chip-circuit-spi4-desc">Schematic of the BMP581 spi 4-wire connection: the chip with U2 MCU, R1 resistor 47 kΩ, C1 capacitor 100 nF, C2 capacitor 100 nF; the MCU wires carry the port hooks Transfer(), WriteRead() or Transfer().</desc>
<rect x="0.5" y="0.5" width="1023" height="648" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">BMP581: SPI 4-wire connection</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Figure 25: the BMP581 on a 4-wire SPI bus, mode 0 or 3, up to 12 MHz, with separate VDDIO and VDD supplies, each with 100</text>
<text x="32" y="125.5" font-size="15" fill="#566070">nF. The MCU drives CSB high before the first frame; the driver's first frame selects SPI. R1 holds MISO high while the chip is in</text>
<text x="32" y="147.3" font-size="15" fill="#566070">I2C mode, where SDO is an input: the frame that only selects SPI then reads 0xFF, which no check of the driver takes for data.</text>
<text x="32" y="169.1" font-size="15" fill="#566070">Above each MCU wire: the port hook that drives it. Datasheet: 6.2.2 SPI 4-wire, Figure 25, p. 47.</text>
<rect x="32" y="185.1" width="960" height="1" fill="#E2E7EE"/>
