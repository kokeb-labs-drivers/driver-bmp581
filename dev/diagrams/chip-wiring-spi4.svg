<text x="50" y="770" font-size="17" fill="#9F1239">+VDDIO: VDDIO; also U2.VDD · +VDD: VDD · GND: VSS; also U2.GND</text>
<text x="50" y="839.5" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="863" font-size="17" fill="#334155">Support parts: 2 capacitors, 1 resistor around the supplies (values in the full schematic).</text>
<text x="32" y="909" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: figure 25 shows no pull-up; recommended so the SPI selection frame (section 5.1) reads 0xFF.</text>
