<text x="52" y="251.3" font-size="17" font-weight="700" fill="#1E429F">MCU</text>
<text x="52" y="279.1" font-size="15" fill="#2B3442">I2C controller</text>
<text x="52" y="343.3" font-size="17" font-weight="700" fill="#0B5F59">BMP581</text>
<text x="52" y="371.1" font-size="15" fill="#2B3442">0x46, SDO to VSS</text>
<text x="52" y="435.3" font-size="17" font-weight="700" fill="#0B5F59">BMP581</text>
<text x="52" y="463.1" font-size="15" fill="#2B3442">0x47, SDO to VDDIO</text>
