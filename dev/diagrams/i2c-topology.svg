<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="i2c-topology-title i2c-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-topology-title">Two BMP581 on one I2C bus</title>
<desc id="i2c-topology-desc">An I2C bus on which an MCU and two BMP581 sensors share SCL and SDA, one at address 0x46 with SDO at VSS and one at 0x47 with SDO at VDDIO, with one pull-up resistor per line.</desc>
<rect x="0.5" y="0.5" width="639" height="619" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">Two BMP581 on one I2C bus</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Datasheet: 5.6 I2C protocol, p. 38; 5.1 Protocol Selection, p. 31.</text>
<rect x="32" y="118.7" width="576" height="1" fill="#E2E7EE"/>
