<text x="46" y="531.3" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="551.8" font-size="15" fill="#334155">Two addresses, 0x46 and 0x47, chosen by the SDO pin (5.6, p. 38).</text>
<text x="46" y="573.5" font-size="15" fill="#334155">CSB tied to VDDIO selects I2C at power-up (5.1, p. 31).</text>
