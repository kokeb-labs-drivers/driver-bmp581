<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1072" viewBox="0 0 1200 1072" role="img" aria-labelledby="measurement-title measurement-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="measurement-title">From a conversion to a value</title>
<desc id="measurement-desc">Flow chart: MeasureOnce() or WaitDataReady() leads to one 12-byte read of TEMP_DATA to STATUS, then the checks: reserved registers and stuck lines, the reset flag, the reset value, the measurement range; each failing check returns its error, and only a frame that passes them all is a value.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="fk-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FB7185"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1071" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">CONTRACT</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">From a conversion to a value</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">No all-0x00 or all-0xFF frame, no reset value and nothing out of range is ever a value.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
