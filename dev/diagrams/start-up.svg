<rect x="32" y="996.8" width="640" height="69" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="32" y="1004.8" width="4" height="53" rx="2" fill="#15803D"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#0B5F59">EnsureInitialized()</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">started already?</text>
<text x="792" y="164.6" font-size="15" font-weight="700" fill="#14532D">Ok, or the start-up again</text>
<text x="792" y="189.4" font-size="13" fill="#2B3442">the reset check: one read; a reset found: from step 1</text>
<rect x="705.2" y="162.3" width="33.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="176.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">yes</text>
<text x="52" y="279.6" font-size="15" font-weight="700" fill="#1E429F">Check the configuration and the address</text>
<text x="52" y="304.4" font-size="13" fill="#2B3442">Validate(config); on I2C 0x46 or 0x47</text>
<rect x="338.3" y="219.8" width="27.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="352" y="234.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">no</text>
<text x="792" y="279.6" font-size="15" font-weight="700" fill="#334155">InvalidArgument</text>
<text x="792" y="304.4" font-size="13" fill="#2B3442">nothing sent</text>
<rect x="704.5" y="277.3" width="35" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="291.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">bad</text>
<text x="52" y="394.6" font-size="15" font-weight="700" fill="#1E429F">1  Bus up, power-up time</text>
<text x="52" y="419.4" font-size="13" fill="#2B3442">port.EnsureInitialized(); wait t_powup (2000 us)</text>
<text x="52" y="438.3" font-size="13" fill="#2B3442">SPI: a dummy CHIP_ID read selects SPI</text>
<text x="792" y="404.1" font-size="15" font-weight="700" fill="#9F1239">Bus</text>
<text x="792" y="428.9" font-size="13" fill="#2B3442">the port could not bring the bus up</text>
<rect x="703.3" y="401.8" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="416.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="528.5" font-size="15" font-weight="700" fill="#1E429F">2  Soft reset</text>
<text x="52" y="553.4" font-size="13" fill="#2B3442">ODR_CONFIG = standby, deep standby off; t_standby</text>
<text x="52" y="572.2" font-size="13" fill="#2B3442">CMD = 0xB6 (NACKed over I2C by design)</text>
<text x="52" y="591.1" font-size="13" fill="#2B3442">wait t_soft_res (2000 us)</text>
<text x="52" y="610" font-size="13" fill="#2B3442">SPI: select SPI again</text>
<text x="792" y="556.5" font-size="15" font-weight="700" fill="#9F1239">NoDevice or Bus</text>
<text x="792" y="581.4" font-size="13" fill="#2B3442">an address NACK; an SPI frame that failed</text>
<rect x="703.3" y="554.3" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="568.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="699.5" font-size="15" font-weight="700" fill="#1E429F">3  Post-power-up checks (section 4.3.9)</text>
<text x="52" y="724.4" font-size="13" fill="#2B3442">CHIP_ID = 0x50</text>
<text x="52" y="743.2" font-size="13" fill="#2B3442">STATUS polled: nvm_rdy = 1, no NVM error</text>
<text x="52" y="762.1" font-size="13" fill="#2B3442">INT_STATUS = 0x10, then 0x00</text>
<text x="792" y="709" font-size="15" font-weight="700" fill="#9F1239">DeviceIdMismatch, Timeout or DeviceFault</text>
<text x="792" y="733.9" font-size="13" fill="#2B3442">another part, or no reset seen; NVM never ready; an</text>
<text x="792" y="752.8" font-size="13" fill="#2B3442">NVM error</text>
<rect x="703.3" y="716.3" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="730.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="852.5" font-size="15" font-weight="700" fill="#1E429F">4  Configuration, in standby</text>
<text x="52" y="877.4" font-size="13" fill="#2B3442">standby, deep standby off; the NVM_DATA marker once</text>
<text x="52" y="896.2" font-size="13" fill="#2B3442">INT_SOURCE = 0, INT_STATUS read, 12 one-byte writes</text>
<text x="52" y="915.1" font-size="13" fill="#2B3442">read all and the marker back, INT_STATUS again</text>
<text x="52" y="934" font-size="13" fill="#2B3442">the power mode, read back with OSR_EFF</text>
<text x="792" y="861.5" font-size="15" font-weight="700" fill="#9F1239">WriteMismatch, ConfigRejected or</text>
<text x="792" y="881" font-size="15" font-weight="700" fill="#9F1239">DeviceReset</text>
<text x="792" y="905.9" font-size="13" fill="#2B3442">a write not kept; ODR too fast for the OSR; a reset</text>
<text x="792" y="924.8" font-size="13" fill="#2B3442">meanwhile</text>
<rect x="703.3" y="878.3" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="892.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="1023.5" font-size="15" font-weight="700" fill="#14532D">Started: Ok</text>
<text x="52" y="1048.4" font-size="13" fill="#2B3442">the chip runs the configuration, pressure enabled</text>
<rect x="318.6" y="963.8" width="66.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="352" y="978.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">all match</text>
<rect x="32" y="1081.2" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="1092.8" font-size="12.5" fill="#566070">your call</text>
<rect x="131.4" y="1081.2" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="153.4" y="1092.8" font-size="12.5" fill="#566070">driver steps</text>
<rect x="251.7" y="1081.2" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="273.7" y="1092.8" font-size="12.5" fill="#566070">fails, nothing sent</text>
<rect x="408.7" y="1081.2" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="430.7" y="1092.8" font-size="12.5" fill="#566070">fails</text>
<rect x="480.5" y="1081.2" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="502.5" y="1092.8" font-size="12.5" fill="#566070">Ok</text>
<path d="M543.9 1087.4L573.9 1087.4" fill="none" stroke="#8893A2" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="587.9" y="1092.8" font-size="12.5" fill="#566070">next step</text>
</svg>
