<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="673" viewBox="0 0 1120 673" role="img" aria-labelledby="chip-circuit-i2c-title chip-circuit-i2c-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-i2c-title">BMP581: I2C connection</title>
<desc id="chip-circuit-i2c-desc">Schematic of the BMP581 i2c connection: the chip with U2 MCU, R1 resistor 4.7 kΩ, R2 resistor 4.7 kΩ, C1 capacitor 100 nF, C2 capacitor 100 nF; the MCU wires carry the port hooks Transfer(), WriteRead() or Transfer().</desc>
<rect x="0.5" y="0.5" width="1119" height="672" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">BMP581: I2C connection</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Figure 26: the BMP581 on an I2C bus with separate VDDIO and VDD supplies, each with 100 nF, and CSB tied to VDDIO (I2C mode). SDO is</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">tied to VSS for the driver's default address 0x46, i2c::kI2cAddress; SDO at VDDIO gives 0x47, i2c::kI2cAddressSdoHigh (section 5.6).</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">Figure 26 leaves SDO to VDDIO or VSS as the address choice. INT goes to an MCU input; leave it out and tie INT to GND when it is not used.</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">Figure 26 shows no pull-ups: the bus needs them (I2C specification). Above each MCU wire: the port hook that drives it. Datasheet: 6.2.3</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">I2C, Figure 26, p. 48.</text>
