<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="817" viewBox="0 0 1200 817" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">BMP581</title>
<desc id="chip-hero-desc">Overview of the BMP581, an absolute barometric pressure sensor that measures pressure from 30 kPa to 125 kPa and temperature, and linearises and compensates both on the chip. A MCU talks to it over I2C or SPI; it drives INT line; it reads back Air pressure, Temperature. Headline figures: 30 to 125 kPa pressure measurement range; 1/64 Pa pressure data resolution; 1.3 µA at 1 Hz in low-power mode; 1.71 to 3.6 V VDD; VDDIO 1.08 to 3.6 V; 12 MHz SPI clock; I2C up to 1 MHz; 2.0 x 2.0 mm LGA-10 body, 0.8 mm high at most.</desc>
