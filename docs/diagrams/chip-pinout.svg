<title id="chip-pinout-title">BMP581 pinout, LGA-10</title>
<desc id="chip-pinout-desc">Pinout of the BMP581 in LGA-10, top view: 10 pins, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
