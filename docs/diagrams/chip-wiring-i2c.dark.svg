<text x="50" y="575.3" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="598.8" font-size="17" fill="#FECDD3">+VDDIO: CSB, VDDIO; also U2.VDD · +VDD: VDD · GND: SDO, VSS; also U2.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#E2E8F0">Support parts: 2 capacitors, 2 resistors around the supplies (values in the full schematic).</text>
<text x="32" y="737.8" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: R1: figure 26 shows no pull-up; 4.7 kΩ to VDDIO suits 100 kHz and 400 kHz; R2: figure 26 shows no pull-up;</text>
<text x="32" y="760.8" font-size="16" fill="#9AA6B5">4.7 kΩ to VDDIO suits 100 kHz and 400 kHz.</text>
