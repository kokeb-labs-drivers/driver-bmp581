<text x="32" y="329.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">fSCL</text>
<text x="608" y="329.8" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 1 MHz</text>
<text x="32" y="350" font-size="15" class="fk-f-ink2">SCL clock frequency, fast mode plus</text>
<text x="32" y="370.1" font-size="14" class="fk-f-muted">Datasheet 5.6 I2C protocol, p. 38</text>
<text x="46" y="424.3" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="444.7" font-size="15" class="fk-f-slate-text">SDO high gives address 0x47; SDO must not float. The register address</text>
<text x="46" y="466.4" font-size="15" class="fk-f-slate-text">byte carries 7 valid bits; its MSB is ignored.</text>
