<text x="237.9" y="249.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">A5</text>
<text x="280.8" y="249.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">A4</text>
