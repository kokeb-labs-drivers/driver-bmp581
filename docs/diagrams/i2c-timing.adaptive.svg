<svg xmlns="http://www.w3.org/2000/svg" width="640" height="513" viewBox="0 0 640 513" role="img" aria-labelledby="i2c-timing-title i2c-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="i2c-timing-title">I2C address byte</title>
<desc id="i2c-timing-desc">I2C address byte of the BMP581: the start condition, the 7-bit address 0x46 with the write bit and the acknowledge, with the clock limit and the address rules of the datasheet.</desc>
