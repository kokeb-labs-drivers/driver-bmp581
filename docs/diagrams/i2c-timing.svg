<text x="323.6" y="154" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">address 0x46 (SDO low) and W</text>
<text x="537.8" y="154" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">ACK</text>
