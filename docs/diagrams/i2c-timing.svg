<text x="195.1" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A6</text>
<text x="237.9" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A5</text>
<text x="280.8" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A4</text>
<text x="323.6" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A3</text>
<text x="366.4" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A2</text>
<text x="409.2" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A1</text>
<text x="452.1" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">A0</text>
<text x="494.9" y="249.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">W</text>
<text x="32" y="293.3" font-size="17" font-weight="700" fill="#0E1726">Timing values</text>
<text x="32" y="329.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">fSCL</text>
<text x="608" y="329.8" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">max 1 MHz</text>
<text x="32" y="350" font-size="15" fill="#2B3442">SCL clock frequency, fast mode plus</text>
<text x="32" y="370.1" font-size="14" fill="#566070">Datasheet 5.6 I2C protocol, p. 38</text>
<text x="46" y="424.3" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="444.7" font-size="15" fill="#334155">SDO high gives address 0x47; SDO must not float. The register address</text>
<text x="46" y="466.4" font-size="15" fill="#334155">byte carries 7 valid bits; its MSB is ignored.</text>
