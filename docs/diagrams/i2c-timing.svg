<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">I2C address byte</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Datasheet: 5.6 I2C protocol, p. 38; 5.6.1 I2C write operation, p. 39.</text>
