<title id="one-measurement-through-the-layers-title">One measurement through the layers</title>
<desc id="one-measurement-through-the-layers-desc">One call through the layers: your code calls MeasureOnce(), the core exchanges frames with the chip through your port and returns the result to your code.</desc>
