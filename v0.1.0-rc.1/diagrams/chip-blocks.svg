<text x="220" y="253.4" font-size="13" fill="#2B3442">voltage reference</text>
<text x="532" y="228.6" font-size="15" font-weight="700" fill="#334155">Analog LDO</text>
<text x="532" y="253.4" font-size="13" fill="#2B3442">analog voltage regulator</text>
<text x="844" y="228.6" font-size="15" font-weight="700" fill="#334155">Digital LDO</text>
