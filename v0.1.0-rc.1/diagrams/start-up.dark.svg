<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1127" viewBox="0 0 1200 1127" role="img" aria-labelledby="start-up-title start-up-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="start-up-title">What EnsureInitialized() does</title>
<desc id="start-up-desc">Flow chart of EnsureInitialized(): check the configuration and the address, wait the power-up time, soft reset, check CHIP_ID, NVM ready and the reset flag, write and read back the configuration, enter the power mode; each failing step returns its error.</desc>
<defs><marker id="fk-arrow-green-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ADE80"/></marker><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="fk-arrow-rose-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FB7185"/></marker><marker id="fk-arrow-slate-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1126" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">CONTRACT</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">What EnsureInitialized() does</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">A soft reset first, whatever an earlier run left. A failed call leaves the driver uninitialised, and the next call starts again at the top.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
